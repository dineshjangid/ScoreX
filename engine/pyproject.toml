[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credittool-engine"
version = "0.1.0"
description = "Core statistical/modeling engine for credit risk scorecard development"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "scipy>=1.12",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
    "reportlab>=4.1",
    "python-docx>=1.1",
    "matplotlib>=3.8",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "shap>=0.45",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pypdf>=4.0"]

[tool.setuptools.packages.find]
include = ["credittool_engine*"]
